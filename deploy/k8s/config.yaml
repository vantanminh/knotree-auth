apiVersion: v1
kind: ConfigMap
metadata:
  name: knotree-accounts-config
  namespace: knotree-accounts
  labels:
    app.kubernetes.io/name: knotree-accounts
    app.kubernetes.io/part-of: knotree-accounts
data:
  APP_ENV: production
  APP_BASE_URL: https://accounts.knotree.com
  BIND_ADDR: 0.0.0.0:8080
  COOKIE_SECURE: "true"
  DEV_MAILBOX: "false"
  EMAIL_PROVIDER: cloudflare
  EMAIL_FROM: accounts@knotree.com
  EMAIL_FROM_NAME: "Knotree Accounts"
  CORS_ORIGINS: https://accounts.knotree.com
  TRUST_PROXY: "true"
  ARGON2_MEMORY_KIB: "65536"
  ARGON2_ITERATIONS: "3"
  ARGON2_PARALLELISM: "1"
  JWT_KEY_ID: knotree-accounts-1
  TOTP_ENCRYPTION_KEY_VERSION: "1"
  LOG_FORMAT: json
