name: Deploy Accounts Worker
permissions:
  contents: read
jobs:
  deploy:
    name: Build and deploy production Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Fail on missing GitHub Worker configuration
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        WORKER_CONFIG_JSON: ${{ vars.WORKER_CONFIG_JSON }}
      run: python3 deploy/ci/worker_config.py frontend/wrangler.ci.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install and build static assets
      working-directory: frontend
      run: |
        npm ci
        npm run build
    - name: Deploy Worker and custom domain
      working-directory: frontend
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: npx wrangler deploy --config wrangler.ci.json
    concurrency:
      group: accounts-worker-production
      cancel-in-progress: false
'on':
  workflow_dispatch: null
  workflow_call: {}
